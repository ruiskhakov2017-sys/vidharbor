server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /health/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }
}
