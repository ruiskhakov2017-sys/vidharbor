limit_req_zone $binary_remote_addr zone=auth_attempts:1m rate=12r/m;

server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /catalog {
        try_files /index.html =404;
    }

    location ^~ /watch/ {
        proxy_pass http://api:8000;
    }

    location = /_vidharbor_watch {
        internal;
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /media/ {
        proxy_pass http://api:8000;
    }

    location ^~ /_vidharbor_hls/ {
        internal;
        alias /var/lib/vidharbor/ready/;
        disable_symlinks on from=/var/lib/vidharbor/ready/;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        add_header Cache-Control "no-store" always;
    }

    location /health/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 8s;
    }

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth_attempts burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
    }

    location ~ ^/api/uploads/[0-9a-f-]+/(content|complete)$ {
        client_max_body_size 5120m;
        client_body_timeout 30s;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
        proxy_pass http://upload:8000;
    }

    location ~ ^/api/videos/[0-9a-f-]+/jobs/[0-9a-f-]+/retry$ {
        proxy_next_upstream off;
        proxy_read_timeout 120s;
        proxy_pass http://upload:8000;
    }

    location /api/ {
        proxy_pass http://api:8000;
    }
}
