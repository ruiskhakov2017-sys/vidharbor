# Explicit opt-in: -f compose.yaml -f compose.observability.yaml --profile observability
x-telemetry: &telemetry
  VIDHARBOR_OBSERVABILITY: "1"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces

services:
  api:
    environment:
      <<: *telemetry
      VIDHARBOR_SERVICE_NAME: api
  upload:
    environment:
      <<: *telemetry
      VIDHARBOR_SERVICE_NAME: upload
  relay:
    environment: *telemetry
  worker:
    environment: *telemetry
  notifier:
    environment: *telemetry
  cleanup:
    environment: *telemetry
  observability-init:
    profiles: [observability]
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    user: "0:0"
    network_mode: none
    read_only: true
    command: [sh, -ec, "chown 10001:10001 /tempo"]
    volumes:
      - tempo_data:/tempo
  tempo:
    profiles: [observability]
    image: grafana/tempo:2.10.10@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38
    user: "10001:10001"
    command: [-config.file=/etc/tempo.yaml]
    depends_on:
      observability-init:
        condition: service_completed_successfully
    volumes:
      - ./config/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:${VIDHARBOR_TEMPO_PORT:-13207}:3200"
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}

volumes:
  tempo_data:
