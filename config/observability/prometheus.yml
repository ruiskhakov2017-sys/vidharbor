global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: vidharbor-http
    scrape_timeout: 4s
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/telemetry_metrics_token
    static_configs:
      - targets: [api:8000, upload:8000]
  - job_name: vidharbor-components
    scrape_timeout: 3s
    authorization:
      credentials_file: /run/secrets/telemetry_metrics_token
    static_configs:
      - targets: [relay:9100, worker:9100, cleanup:9100]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
