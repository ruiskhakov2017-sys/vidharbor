apiVersion: 1
datasources:
  - name: VidHarbor Prometheus
    uid: vidharbor-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData: {httpMethod: POST, timeInterval: 5s}
  - name: VidHarbor Tempo
    uid: vidharbor-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
