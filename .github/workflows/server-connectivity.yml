name: VidHarbor portfolio deployment

on:
  workflow_dispatch:
    inputs:
      check_ssh:
        description: Apply the VidHarbor release after preflight
        required: true
        type: boolean
        default: false
      verify_browser:
        description: Verify the published guest studio in Chromium
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vidharbor-portfolio-production
  cancel-in-progress: false

jobs:
  deployment:
    if: github.ref == 'refs/heads/deploy/vidharbor-portfolio' && !inputs.verify_browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOY_RELEASE: e7f513bd2443d3684b7e732ebb882548b9625f46
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install SSH password transport
        run: |
          if ! command -v sshpass >/dev/null; then
            sudo apt-get -qq update
            sudo apt-get -qq install -y sshpass
          fi
      - name: Check or apply the release
        env:
          SSHPASS: ${{ secrets.VIDHARBOR_SERVER_PASSWORD }}
          PINNED_HOST_KEYS: ${{ secrets.VIDHARBOR_DIAGNOSTIC_KNOWN_HOSTS }}
          APPLY_RELEASE: ${{ inputs.check_ssh }}
        run: bash scripts/portfolio-runner.sh

  public-browser:
    if: github.ref == 'refs/heads/deploy/vidharbor-portfolio' && inputs.verify_browser
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare browser dependencies and synthetic clip
        run: |
          python3 -m venv "$RUNNER_TEMP/browser"
          "$RUNNER_TEMP/browser/bin/pip" install -r scripts/requirements-smoke.txt
      - name: Verify guest upload, anonymous playback and deletion on the public site
        run: "$RUNNER_TEMP/browser/bin/python scripts/portfolio-browser.py"
