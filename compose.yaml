name: vidharbor

x-logging: &bounded-logging
  driver: json-file
  options: {max-size: 1m, max-file: "3"}

x-django: &django
  logging: *bounded-logging
  build:
    context: ./api
    target: app
  environment:
    DB_NAME: ${VIDHARBOR_DB_NAME:-vidharbor}
    DB_USER: ${VIDHARBOR_DB_USER:-vidharbor}
    RABBITMQ_USER: ${VIDHARBOR_RABBITMQ_USER:-vidharbor}
    MAX_UPLOAD_BYTES: ${VIDHARBOR_MAX_UPLOAD_BYTES:-5368709120}
    RESTORE_MODE: ${VIDHARBOR_RESTORE_MODE:-0}
  volumes:
    - journal_data:/var/lib/vidharbor-journal
  secrets:
    - django_secret_key
    - postgres_password
    - rabbitmq_password

x-django-health: &django-health
  test: ["CMD", "wget", "-q", "-T", "6", "-O", "/dev/null", "http://127.0.0.1:8000/health/live"]
  interval: 8s
  timeout: 12s
  start_period: 45s
  retries: 8

services:
  web:
    logging: *bounded-logging
    build: ./web
    ports:
      - "127.0.0.1:${VIDHARBOR_PORT:-8085}:80"
    volumes:
      - media_data:/var/lib/vidharbor:ro
    depends_on:
      api:
        condition: service_healthy
      upload:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.5

  migrate:
    <<: *django
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 192m
    cpus: 1

  api:
    <<: *django
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    volumes:
      - media_data:/var/lib/vidharbor
      - journal_data:/var/lib/vidharbor-journal
    healthcheck: *django-health
    mem_limit: 192m
    cpus: 1

  upload:
    <<: *django
    build:
      context: ./api
      target: upload
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/var/lib/vidharbor
      - journal_data:/var/lib/vidharbor-journal
    healthcheck: *django-health
    mem_limit: 256m
    cpus: 1

  cleanup:
    <<: *django
    command: ["python", "manage.py", "cleanup_uploads", "--watch"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/var/lib/vidharbor
      - journal_data:/var/lib/vidharbor-journal
    restart: on-failure
    mem_limit: 96m
    cpus: 0.25

  relay:
    <<: *django
    command: ["python", "manage.py", "relay_outbox"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    mem_limit: 128m
    cpus: 0.5

  worker:
    <<: *django
    build:
      context: ./api
      target: upload
    environment:
      DB_NAME: ${VIDHARBOR_DB_NAME:-vidharbor}
      DB_USER: ${VIDHARBOR_DB_USER:-vidharbor}
      RABBITMQ_USER: ${VIDHARBOR_RABBITMQ_USER:-vidharbor}
      PUBLIC_BASE_URL: ${VIDHARBOR_PUBLIC_BASE_URL:-http://127.0.0.1:${VIDHARBOR_PORT:-8085}}
      FFMPEG_TIMEOUT: ${VIDHARBOR_FFMPEG_TIMEOUT:-10800}
      RESTORE_MODE: ${VIDHARBOR_RESTORE_MODE:-0}
    command: ["python", "manage.py", "transcode_videos"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    volumes:
      - media_data:/var/lib/vidharbor
      - journal_data:/var/lib/vidharbor-journal
    init: true
    restart: on-failure
    mem_limit: 1024m
    cpus: 2

  notifier:
    <<: *django
    profiles: [notifications]
    command: ["python", "manage.py", "notify_ready", "--url", "${VIDHARBOR_WEBHOOK_URL:-}", "--allow-host", "${VIDHARBOR_WEBHOOK_HOST:-}"]
    secrets:
      - django_secret_key
      - postgres_password
      - rabbitmq_password
      - webhook_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    mem_limit: 128m
    cpus: 0.5

  db:
    logging: *bounded-logging
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${VIDHARBOR_DB_NAME:-vidharbor}
      POSTGRES_USER: ${VIDHARBOR_DB_USER:-vidharbor}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 4s
      start_period: 60s
      retries: 12
    mem_limit: 256m
    cpus: 1

  rabbitmq:
    logging: *bounded-logging
    image: rabbitmq:4.2-alpine@sha256:dea0f5843025e0c3c1a128b14fc2e181ea59ff369e7048e6a7fbac83bd8c4f9d
    hostname: rabbitmq
    init: true
    environment:
      RABBITMQ_DEFAULT_USER: ${VIDHARBOR_RABBITMQ_USER:-vidharbor}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
    entrypoint:
      - /bin/sh
      - /usr/local/bin/vidharbor-rabbitmq-init
    secrets:
      - rabbitmq_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq-entrypoint.sh:/usr/local/bin/vidharbor-rabbitmq-init:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/vidharbor-policy-ready && exec su-exec rabbitmq rabbitmq-diagnostics -q check_running"]
      start_period: 120s
      interval: 15s
      timeout: 20s
      retries: 8
    mem_limit: 512m
    cpus: 1

volumes:
  postgres_data:
  rabbitmq_data:
  media_data:
  journal_data:

secrets:
  django_secret_key:
    file: ${VIDHARBOR_SECRETS_DIR:-./secrets}/django_secret_key
  postgres_password:
    file: ${VIDHARBOR_SECRETS_DIR:-./secrets}/postgres_password
  rabbitmq_password:
    file: ${VIDHARBOR_SECRETS_DIR:-./secrets}/rabbitmq_password
  webhook_secret:
    file: ${VIDHARBOR_SECRETS_DIR:-./secrets}/webhook_secret
